name: Record public Discord member counts

on:
  schedule:
    # Daily, approximately 20:15 Europe/Berlin in winter.
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-member-counts
  cancel-in-progress: false

jobs:
  daily-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out community website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture one anonymous aggregate snapshot
        run: python scripts/track_discord_members.py
      - name: Commit updated public count if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/member-counts.csv
          if git diff --cached --quiet; then
            echo "No new daily snapshot to commit."
            exit 0
          fi
          git commit -m "Record daily public Discord member snapshot"
          git push
